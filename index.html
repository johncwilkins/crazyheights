<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101426"><title>Crazy Heights</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101426;color:white;font-family:system-ui;touch-action:none}#game{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top);left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:900;text-shadow:1px 2px #000}#help{position:fixed;top:48px;width:100%;text-align:center;font-size:12px;color:#fff9;pointer-events:none}#reset{position:fixed;right:12px;top:55px;background:#253451;color:#fff;border:1px solid #fff6;border-radius:10px;padding:8px;touch-action:manipulation}</style></head><body><canvas id="game"></canvas><div id="hud"><span>CRAZY HEIGHTS</span><span id="score">FLOOR 0</span></div><div id="help">Two thumbs • reach UP, pull DOWN • both LEFT/RIGHT to shuffle</div><button id="reset">Restart</button><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),score=document.getElementById('score');
let W,H,dpr,worldTop=0,climb=0,lane=2,arms=[0,0],lastDirs=[0,0],touches=new Map(),sticks=[null,null],shake=0,visualClimb=0,visualLane=2,prevFrame=0,stepPhase=0,handPose=[.52,.52],lastPull=-1,bodyBob=0;
const cols=5,rows=6;let topH,cellW,rowH,buildingX,buildingW;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);topH=H*.74;buildingW=Math.min(W*.94,460);buildingX=(W-buildingW)/2;cellW=buildingW/cols;rowH=topH/rows}addEventListener('resize',resize);resize();
function reset(){climb=0;lane=2;arms=[0,0];lastDirs=[0,0];worldTop=0;visualClimb=0;visualLane=2;handPose=[.52,.52];lastPull=-1;bodyBob=0;score.textContent='FLOOR 0'}document.getElementById('reset').onclick=reset;
function dir(dx,dy){let dead=19;if(Math.hypot(dx,dy)<dead)return 0;if(Math.abs(dy)>Math.abs(dx)*1.12)return dy<0?1:2;return dx<0?3:4}
function begin(e){e.preventDefault();let side=e.clientX<W/2?0:1;if(sticks[side])return;let t={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0,dir:0};sticks[side]=t;touches.set(e.pointerId,side);canvas.setPointerCapture(e.pointerId)}
function move(e){if(!touches.has(e.pointerId))return;e.preventDefault();let side=touches.get(e.pointerId),s=sticks[side];if(!s)return;let dx=e.clientX-s.x,dy=e.clientY-s.y,m=Math.hypot(dx,dy),max=54;if(m>max){dx*=max/m;dy*=max/m}s.dx=dx;s.dy=dy;let d=dir(dx,dy);if(d!==s.dir){s.dir=d;handle(side,d)}}
function end(e){let side=touches.get(e.pointerId);if(side===undefined)return;touches.delete(e.pointerId);sticks[side]=null;lastDirs[side]=0}
canvas.addEventListener('pointerdown',begin);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
function handle(side,d){
  lastDirs[side]=d;
  // Each hand is independent: one reaches while the other pulls.
  // A new pull advances the climb without forcing the opposite hand to reset.
  if(d===1)arms[side]=1;
  if(d===2&&arms[side]===1){
    arms[side]=0;
    climb+=lastPull!==side?.34:.24;
    lastPull=side;
    bodyBob=1;
    score.textContent='FLOOR '+Math.floor(climb);
  }
  if((d===3||d===4)&&lastDirs[1-side]===d){
    lane=Math.max(0,Math.min(4,lane+(d===3?-1:1)));
    lastDirs=[0,0];
  }
}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function line(x,y,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}
function draw(){ctx.clearRect(0,0,W,H);rect(0,0,W,H,'#101426');rect(buildingX,0,buildingW,topH,'#746f8b');let dt=Math.min(50,Math.max(0,performance.now()-prevFrame||16.7));prevFrame=performance.now();let ease=1-Math.exp(-dt/145);visualClimb+=(climb-visualClimb)*ease;visualLane+=(lane-visualLane)*(1-Math.exp(-dt/170));let moving=Math.abs(lane-visualLane)>.015;for(let a=0;a<2;a++){let target=arms[a]?-.91:.52;handPose[a]+=(target-handPose[a])*(1-Math.exp(-dt/75))}bodyBob*=Math.exp(-dt/140);stepPhase+=moving?dt*.026:0;let offset=(visualClimb%1)*rowH;for(let r=-1;r<rows+1;r++){let y=r*rowH+offset;for(let c=0;c<cols;c++){let x=buildingX+c*cellW;rect(x+2,y+2,cellW-4,rowH-4,'#a7a4ae');let wx=x+cellW*.17,wy=y+rowH*.13,ww=cellW*.66,wh=rowH*.68;rect(wx-3,wy-3,ww+6,wh+6,'#3a354e');rect(wx,wy,ww,wh,((r+c)%7===0)?'#edb968':'#253b60');rect(wx+ww*.48,wy,3,wh,'#c8d3e2');rect(wx,wy+wh*.52,ww,3,'#c8d3e2');rect(x+cellW*.08,y+rowH*.85,cellW*.84,5,'#e3d9c6')}}let px=buildingX+(visualLane+.5)*cellW,py=topH*.63,scale=Math.min(cellW*.48,27);ctx.save();ctx.translate(px,py+bodyBob*scale*.2);rect(-scale*.35,scale*.05,scale*.7,scale*.8,'#e86c4d');ctx.fillStyle='#f5c89a';ctx.beginPath();ctx.arc(0,-scale*.22,scale*.31,0,Math.PI*2);ctx.fill();let stride=moving?Math.sin(stepPhase)*scale*.24:0;line(-scale*.15,scale*.83,-scale*.4+stride,scale*1.38,'#222337',5);line(scale*.15,scale*.83,scale*.4-stride,scale*1.38,'#222337',5);for(let i=0;i<2;i++){let sign=i===0?-1:1;let handY=handPose[i]*scale;let handX=sign*scale*(handPose[i]<0?.62:.58);let elbowX=sign*scale*.57,elbowY=(handY+scale*.18)*.5;line(sign*scale*.3,scale*.18,elbowX,elbowY,'#f5c89a',5);line(elbowX,elbowY,handX,handY,'#f5c89a',5);ctx.fillStyle='#f5c89a';ctx.beginPath();ctx.arc(handX,handY,3.6,0,Math.PI*2);ctx.fill()}ctx.restore();shake*=Math.pow(.75,dt/16.7);rect(0,topH,W,H-topH,'#171e34');line(0,topH,W,topH,'#f4be5a',3);ctx.textAlign='center';ctx.font='12px system-ui';ctx.fillStyle='#aab7d0';ctx.fillText('LEFT ARM',W*.25,topH+20);ctx.fillText('RIGHT ARM',W*.75,topH+20);for(let i=0;i<2;i++){let s=sticks[i],x=s?s.x:W*(i?.75:.25),y=s?s.y:topH+(H-topH)*.58,r=Math.min(57,W*.14);ctx.strokeStyle='#7589b4';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#647cae99';ctx.beginPath();ctx.arc(x+(s?s.dx:0),y+(s?s.dy:0),r*.42,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}draw();
</script></body></html>
